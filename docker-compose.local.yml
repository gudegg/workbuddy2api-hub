# 自用部署文件 —— 完全独立于上游，永不与上游的 compose 文件冲突。
# 网段不写死：在 .env 里用 WB_NETWORK 指定（本文件不设默认值）。
# 启动：./update.sh
# 等价于：docker compose -f docker-compose.local.yml up -d --build
services:
  wb-proxy:
    build: .
    image: wb-proxy:local
    container_name: wb-proxy
    restart: unless-stopped
#    ports:
#      # 不向宿主机暴露端口；仅在 WB_NETWORK 指定的网络内可达
#      - "8788:8788"
    environment:
      - HOST=0.0.0.0
      - PORT=8788
      # - API_KEY=your_secret_key
      - TZ=Asia/Shanghai
    volumes:
      - ./accounts:/app/accounts
      - ./usage:/app/usage
    healthcheck:
      # 容器内探应用自带的 /health（免鉴权）；失败即标记 unhealthy
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8788')+'/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  default:
    name: ${WB_NETWORK:?请在 .env 里设置 WB_NETWORK}
    external: true
